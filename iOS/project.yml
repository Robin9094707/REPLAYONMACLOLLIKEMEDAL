name: SimplexRemote
options:
  bundleIdPrefix: com.simplex
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  SimplexRemote:
    type: application
    platform: iOS
    sources:
      - path: SimplexRemote
    info:
      path: SimplexRemote/Info.plist
      properties:
        CFBundleDisplayName: Simplex Remote
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: "Zum Scannen des Kopplungs-QR-Codes deines Macs."
        NSFaceIDUsageDescription: "Face ID schützt das gespeicherte Mac-Passwort zum Entsperren."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.simplex.remote
            CFBundleURLSchemes:
              - simplexremote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplex.remote
        PRODUCT_NAME: SimplexRemote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
