name: Build Simplex Suite, Remote & Server

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  mac:
    name: macOS-App (Simplex Suite)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: App bauen
        run: |
          xcodebuild -version
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SimplexSuite-${{ env.VERSION }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  ios:
    name: iOS-App (Simplex Remote, unsignierte IPA)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen (Liquid Glass braucht Xcode 26)
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: App-Symbol erzeugen
        run: swift scripts/make_icon.swift iOS/SimplexRemote/Assets.xcassets/AppIcon.appiconset/icon_1024.png fullbleed

      - name: Projekt erzeugen & bauen
        working-directory: iOS
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project SimplexRemote.xcodeproj -target SimplexRemote -configuration Release \
            -sdk iphoneos CURRENT_PROJECT_VERSION=${BUILD_NUMBER} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 60
          test -f build/Release-iphoneos/SimplexRemote.app/SimplexRemote

      - name: IPA packen
        working-directory: iOS
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SimplexRemote.app Payload/
          zip -qry ../SimplexRemote.ipa Payload
          ls -lh ../SimplexRemote.ipa
          test "$(stat -f%z ../SimplexRemote.ipa)" -gt 100000

      - uses: actions/upload-artifact@v4
        with:
          name: SimplexRemote-iOS-${{ github.run_number }}
          path: SimplexRemote.ipa
          if-no-files-found: error

  server:
    name: Relay-Server (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Server-Selbsttest
        run: |
          pip install -r server/requirements.txt
          python -m py_compile server/relay.py
      - uses: actions/upload-artifact@v4
        with:
          name: SimplexRelay-Server-${{ github.run_number }}
          path: |
            server/relay.py
            server/requirements.txt
            server/README.md

  release:
    name: GitHub Release (nur bei Tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, ios, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.ipa
            artifacts/**/relay.py
            artifacts/**/requirements.txt
          generate_release_notes: true
